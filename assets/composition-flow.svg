<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title"><title id="title">Skill composition flow</title><rect width="1200" height="310" rx="20" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="55" y="45" fill="#78350f" font-family="Arial" font-size="21" font-weight="700">Example: build a production-ready web product</text><g font-family="Arial" text-anchor="middle"><rect x="50" y="105" width="175" height="78" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="137" y="137" fill="#1e40af" font-size="15" font-weight="700">1 · DESIGN</text><text x="137" y="160" fill="#475569" font-size="12">design-web</text><path d="M235 144h55" stroke="#d97706" stroke-width="4"/><rect x="305" y="105" width="175" height="78" rx="13" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="392" y="137" fill="#3730a3" font-size="15" font-weight="700">2 · BUILD</text><text x="392" y="160" fill="#475569" font-size="12">code-engineering</text><path d="M490 144h55" stroke="#d97706" stroke-width="4"/><rect x="560" y="105" width="175" height="78" rx="13" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="647" y="137" fill="#115e59" font-size="15" font-weight="700">3 · CONNECT</text><text x="647" y="160" fill="#475569" font-size="12">backend · database</text><path d="M745 144h55" stroke="#d97706" stroke-width="4"/><rect x="815" y="105" width="145" height="78" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="887" y="137" fill="#166534" font-size="15" font-weight="700">4 · PROTECT</text><text x="887" y="160" fill="#475569" font-size="12">security</text><path d="M970 144h55" stroke="#d97706" stroke-width="4"/><rect x="1040" y="105" width="110" height="78" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1095" y="137" fill="#92400e" font-size="15" font-weight="700">5 · SHIP</text><text x="1095" y="160" fill="#475569" font-size="12">testing · deploy</text></g><text x="600" y="250" fill="#92400e" font-family="Arial" font-size="15" text-anchor="middle">Each skill owns one responsibility. The chain owns the outcome.</text></svg>
