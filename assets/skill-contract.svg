<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">Skill contract</title><desc id="desc">A visual contract showing the five parts of a Kaido skill.</desc><rect width="1200" height="310" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="52" y="48" fill="#0f172a" font-family="Arial" font-size="22" font-weight="700">Every skill has a contract</text><text x="52" y="75" fill="#64748b" font-family="Arial" font-size="14">Clear boundaries make agents more predictable.</text><g font-family="Arial" text-anchor="middle"><g><rect x="55" y="125" width="190" height="92" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="150" y="160" fill="#115e59" font-size="16" font-weight="700">01 · TRIGGER</text><text x="150" y="187" fill="#475569" font-size="13">when to use it</text></g><path d="M255 171h45" stroke="#94a3b8" stroke-width="3"/><g><rect x="315" y="125" width="190" height="92" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="410" y="160" fill="#1e40af" font-size="16" font-weight="700">02 · SCOPE</text><text x="410" y="187" fill="#475569" font-size="13">what it covers</text></g><path d="M515 171h45" stroke="#94a3b8" stroke-width="3"/><g><rect x="575" y="125" width="190" height="92" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="670" y="160" fill="#6d28d9" font-size="16" font-weight="700">03 · METHOD</text><text x="670" y="187" fill="#475569" font-size="13">how it works</text></g><path d="M775 171h45" stroke="#94a3b8" stroke-width="3"/><g><rect x="835" y="125" width="140" height="92" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="905" y="160" fill="#92400e" font-size="16" font-weight="700">04 · OUTPUT</text><text x="905" y="187" fill="#475569" font-size="13">what it returns</text></g><path d="M985 171h45" stroke="#94a3b8" stroke-width="3"/><g><rect x="1045" y="125" width="105" height="92" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1097" y="160" fill="#166534" font-size="16" font-weight="700">05</text><text x="1097" y="187" fill="#166534" font-size="14" font-weight="700">VERIFY</text></g></g></svg>
