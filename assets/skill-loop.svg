<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-labelledby="title"><title id="title">Kaido skill loop</title><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect width="1200" height="240" rx="24" fill="#0f172a"/><text x="52" y="43" fill="#e2e8f0" font-family="Arial" font-size="22" font-weight="700">A skill turns an ambiguous task into a repeatable workflow</text><g font-family="Arial" text-anchor="middle"><g><circle cx="155" cy="137" r="57" fill="#312e81"/><text x="155" y="130" fill="white" font-size="17" font-weight="700">Route</text><text x="155" y="153" fill="#c7d2fe" font-size="13">choose a skill</text></g><g><circle cx="445" cy="137" r="57" fill="#3730a3"/><text x="445" y="130" fill="white" font-size="17" font-weight="700">Load</text><text x="445" y="153" fill="#c7d2fe" font-size="13">read the contract</text></g><g><circle cx="735" cy="137" r="57" fill="#155e75"/><text x="735" y="130" fill="white" font-size="17" font-weight="700">Apply</text><text x="735" y="153" fill="#a5f3fc" font-size="13">follow the method</text></g><g><circle cx="1025" cy="137" r="57" fill="#065f46"/><text x="1025" y="130" fill="white" font-size="17" font-weight="700">Verify</text><text x="1025" y="153" fill="#a7f3d0" font-size="13">check the result</text></g><path d="M225 137h145M515 137h145M805 137h145" stroke="url(#g)" stroke-width="5"/></g></svg>
