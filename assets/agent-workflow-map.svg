<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 330" role="img" aria-labelledby="title desc"><title id="title">Kaido Agent Skills workflow map</title><desc id="desc">A clear five-step horizontal workflow from request framing to verified evidence.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1120"/><stop offset=".52" stop-color="#1e1b4b"/><stop offset="1" stop-color="#134e4a"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#86efac"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1400" height="330" rx="26" fill="url(#bg)"/><g opacity=".08" stroke="#fff"><path d="M0 78h1400M0 156h1400M0 234h1400M110 0v330M270 0v330M430 0v330M590 0v330M750 0v330M910 0v330M1070 0v330M1230 0v330"/></g><text x="50" y="52" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">The operating map</text><text x="50" y="79" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="15">One clear route: frame the work, choose the owner, execute, then prove the result.</text><path d="M136 184H1260" stroke="#020617" stroke-width="15" stroke-linecap="round" opacity=".55"/><path d="M136 184H1260" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g><rect x="55" y="115" width="190" height="138" rx="16" fill="#164e63" stroke="#67e8f9" stroke-width="2"/><circle cx="95" cy="155" r="22" fill="#082f49" stroke="#67e8f9" stroke-width="3"/><text x="95" y="162" fill="#cffafe" font-size="17" font-weight="700">01</text><text x="150" y="156" fill="#ecfeff" font-size="17" font-weight="700">FRAME</text><text x="150" y="186" fill="#bae6fd" font-size="13">المهمة والقيود</text><text x="150" y="211" fill="#bae6fd" font-size="12">ما النتيجة المطلوبة؟</text></g><g><rect x="300" y="115" width="190" height="138" rx="16" fill="#312e81" stroke="#c4b5fd" stroke-width="2"/><circle cx="340" cy="155" r="22" fill="#1e1b4b" stroke="#c4b5fd" stroke-width="3"/><text x="340" y="162" fill="#ede9fe" font-size="17" font-weight="700">02</text><text x="395" y="156" fill="#f5f3ff" font-size="17" font-weight="700">ROUTE</text><text x="395" y="186" fill="#ddd6fe" font-size="13">المجال والمالك</text><text x="395" y="211" fill="#ddd6fe" font-size="12">من المسؤول عن القرار؟</text></g><g><rect x="545" y="115" width="190" height="138" rx="16" fill="#713f12" stroke="#fcd34d" stroke-width="2"/><circle cx="585" cy="155" r="22" fill="#451a03" stroke="#fcd34d" stroke-width="3"/><text x="585" y="162" fill="#fef3c7" font-size="17" font-weight="700">03</text><text x="640" y="156" fill="#fffbeb" font-size="17" font-weight="700">EXECUTE</text><text x="640" y="186" fill="#fde68a" font-size="13">خطوات وأدوات</text><text x="640" y="211" fill="#fde68a" font-size="12">مخرج قابل للفحص</text></g><g><rect x="790" y="115" width="190" height="138" rx="16" fill="#166534" stroke="#86efac" stroke-width="2"/><circle cx="830" cy="155" r="22" fill="#14532d" stroke="#86efac" stroke-width="3"/><text x="830" y="162" fill="#dcfce7" font-size="17" font-weight="700">04</text><text x="885" y="156" fill="#f0fdf4" font-size="17" font-weight="700">COMPOSE</text><text x="885" y="186" fill="#bbf7d0" font-size="13">تركيب وتسليم</text><text x="885" y="211" fill="#bbf7d0" font-size="12">تمرير الأدلة للمرحلة التالية</text></g><g><rect x="1035" y="115" width="310" height="138" rx="16" fill="#831843" stroke="#f9a8d4" stroke-width="2"/><circle cx="1075" cy="155" r="22" fill="#500724" stroke="#f9a8d4" stroke-width="3"/><text x="1075" y="162" fill="#fce7f3" font-size="17" font-weight="700">05</text><text x="1190" y="156" fill="#fdf2f8" font-size="17" font-weight="700">VERIFY &amp; HAND OFF</text><text x="1190" y="186" fill="#fbcfe8" font-size="13">التحقق والمخاطر والخطوة التالية</text><text x="1190" y="211" fill="#fbcfe8" font-size="12">لا إعلان نجاح بلا دليل</text></g></g><g fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="middle"><text x="272" y="194">›</text><text x="517" y="194">›</text><text x="762" y="194">›</text><text x="1012" y="194">›</text></g></svg>
