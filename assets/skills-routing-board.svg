<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc"><title id="title">Kaido Agent Skills routing board</title><desc id="desc">A visual routing board that maps task types to primary skills, supporting skills, and verification evidence.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1120"/><stop offset=".55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#134e4a"/></linearGradient><linearGradient id="route" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#86efac"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1400" height="430" rx="28" fill="url(#bg)"/><g opacity=".08" stroke="#fff"><path d="M0 86h1400M0 172h1400M0 258h1400M0 344h1400M120 0v430M280 0v430M440 0v430M600 0v430M760 0v430M920 0v430M1080 0v430M1240 0v430"/></g><text x="52" y="52" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Skill Routing Board</text><text x="52" y="81" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="15">Start with the outcome — route to the owner — compose only what the risk requires.</text><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><rect x="48" y="118" width="236" height="246" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="2"/><text x="166" y="151" fill="#cffafe" font-size="17" font-weight="700">01 · YOUR OUTCOME</text><rect x="78" y="176" width="176" height="38" rx="9" fill="#082f49"/><text x="166" y="201" fill="#ecfeff" font-size="14">Build / design</text><rect x="78" y="224" width="176" height="38" rx="9" fill="#082f49"/><text x="166" y="249" fill="#ecfeff" font-size="14">Repair / secure</text><rect x="78" y="272" width="176" height="38" rx="9" fill="#082f49"/><text x="166" y="297" fill="#ecfeff" font-size="14">Ship / document</text><text x="166" y="340" fill="#bae6fd" font-size="12">What must be true at the end?</text><path d="M284 240h65" stroke="url(#route)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/><text x="319" y="224" fill="#f8fafc" font-size="24">›</text><rect x="349" y="118" width="250" height="246" rx="18" fill="#312e81" stroke="#c4b5fd" stroke-width="2"/><text x="474" y="151" fill="#ede9fe" font-size="17" font-weight="700">02 · ROUTE OWNER</text><rect x="381" y="181" width="186" height="58" rx="10" fill="#1e1b4b" stroke="#c4b5fd"/><text x="474" y="207" fill="#f5f3ff" font-size="15" font-weight="700">PRIMARY SKILL</text><text x="474" y="227" fill="#ddd6fe" font-size="12">owns the main decision</text><text x="474" y="274" fill="#ddd6fe" font-size="13">Choose by responsibility,</text><text x="474" y="295" fill="#ddd6fe" font-size="13">not by tool preference.</text><text x="474" y="340" fill="#c4b5fd" font-size="12">One owner keeps the route clear.</text><path d="M599 240h65" stroke="url(#route)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/><text x="634" y="224" fill="#f8fafc" font-size="24">›</text><rect x="664" y="118" width="300" height="246" rx="18" fill="#713f12" stroke="#fcd34d" stroke-width="2"/><text x="814" y="151" fill="#fef3c7" font-size="17" font-weight="700">03 · SUPPORTING PATH</text><rect x="696" y="181" width="236" height="38" rx="9" fill="#451a03"/><text x="814" y="206" fill="#fffbeb" font-size="14">Related skills only when needed</text><path d="M727 250h174" stroke="#fcd34d" stroke-width="2"/><circle cx="754" cy="250" r="7" fill="#fcd34d"/><circle cx="814" cy="250" r="7" fill="#fcd34d"/><circle cx="874" cy="250" r="7" fill="#fcd34d"/><text x="814" y="286" fill="#fde68a" font-size="13">Design → Engineering → Testing</text><text x="814" y="319" fill="#fde68a" font-size="12">Add a skill only if it closes a real gap.</text><path d="M964 240h65" stroke="url(#route)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/><text x="999" y="224" fill="#f8fafc" font-size="24">›</text><rect x="1029" y="118" width="323" height="246" rx="18" fill="#166534" stroke="#86efac" stroke-width="2"/><text x="1190" y="151" fill="#dcfce7" font-size="17" font-weight="700">04 · PROOF OF DONE</text><rect x="1061" y="181" width="259" height="38" rx="9" fill="#14532d"/><text x="1190" y="206" fill="#f0fdf4" font-size="14">Evidence before confidence</text><text x="1190" y="254" fill="#bbf7d0" font-size="13">✓ test or reproducible run</text><text x="1190" y="279" fill="#bbf7d0" font-size="13">✓ changed files and risks</text><text x="1190" y="304" fill="#bbf7d0" font-size="13">✓ handoff and next step</text><text x="1190" y="340" fill="#86efac" font-size="12">No evidence, no completion claim.</text></g></svg>
