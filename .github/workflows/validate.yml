name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node (for JS syntax checks)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate library (frontmatter, references, syntax, secrets)
        run: python tools/validate_skills.py
